server:
  port: 8083
spring:
  application:
    name: report-service
  datasource:
    url: jdbc:postgresql://localhost:5432/shipment_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: report-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer

      properties:
        spring.json.trusted.packages: "com.example.report.kafka"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.report.kafka.ShipmentStatusChangedEvent
