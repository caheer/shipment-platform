server:
  port: 8081
app:
  config:
    threads: 3
services:
  shipment:
    base-url: http://localhost:8080
spring:
  application:
    name: pdf-service
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
  datasource:
    url: jdbc:postgresql://localhost:5432/shipment_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

