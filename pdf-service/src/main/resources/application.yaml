server:
  port: 8081

app:
  config:
    threads: 3
  pdf:
    output-directory: ${PDF_OUTPUT_DIRECTORY:./generated-pdfs}

services:
  shipment:
    base-url: ${SHIPMENT_SERVICE_URL:http://localhost:8080}

spring:
  application:
    name: pdf-service
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s
  datasource:
    url: ${PDF_DB_URL:jdbc:postgresql://localhost:5432/pdf_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
